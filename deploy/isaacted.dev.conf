# isaacted.dev - static portfolio, served straight off disk by nginx.
#
# This host runs two other projects. Nothing here touches them:
#   * NO port is opened or listened on - nginx reads the files itself, so this
#     cannot collide with Chekit (3000-3003, 4000, 4001, 8000, 8080) or Carniva
#     (127.0.0.1:8081).
#   * No Docker, no container, no daemon.
#   * Their nginx configs are separate files and are not touched.
#   * Files are owned by a dedicated `isaacted` account with no sudo and no
#     docker group, so the deploy path cannot reach either of them.
#
# The only shared resource is nginx itself, and `nginx -t` runs BEFORE any
# reload - so a mistake in this file means "the portfolio does not go live",
# never "the other sites go down".
#
# INSTALL
#   sudo install -o root -g root -m 644 /tmp/isaacted.dev.conf \
#        /etc/nginx/sites-available/isaacted.dev.conf
#   sudo ln -sfn /etc/nginx/sites-available/isaacted.dev.conf \
#        /etc/nginx/sites-enabled/isaacted.dev.conf
#   sudo nginx -t          # MUST pass before the next line
#   sudo systemctl reload nginx
#
# THEN issue the certificate (certbot rewrites the listen lines below):
#   sudo certbot --nginx -d isaacted.dev -d www.isaacted.dev
#
# .dev is on the HSTS preload list, so browsers refuse plain HTTP on it
# outright. The site is simply unreachable until the certificate exists - that
# is the TLD's behaviour, not a misconfiguration.

server {
    listen 80;
    listen [::]:80;
    server_name isaacted.dev www.isaacted.dev;

    # The document root is a SUBDIRECTORY of the deploy user's home, never the
    # home itself. The home holds ~/.ssh/authorized_keys; serving the home would
    # publish that file to anyone who guessed the path.
    root /srv/isaacted/public;
    index index.html;

    # The whole site is one 1.9 MB index.html with its images inlined as base64.
    # Compress what is left: the base64 payload is already-compressed JPEG data
    # and will barely shrink, but the markup and CSS around it do.
    gzip on;
    # text/html is NOT listed: nginx always gzips it, and naming it here is a
    # "duplicate MIME type" warning at config test.
    gzip_types text/css application/javascript;
    gzip_min_length 1024;

    # Belt and braces alongside the root above: never serve a dotfile, whatever
    # ends up in the tree.
    location ~ /\. {
        deny all;
        access_log off;
    }

    # Everything lives in one file, so there is no SPA routing to fake: serve
    # the file, the directory index, or a plain 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # no-cache means REVALIDATE, not "never cache". The browser keeps the copy
    # and asks if it changed; nginx answers 304 from the ETag when it has not.
    # So a repeat visitor pays nothing, and a push is live immediately - which
    # matters when the page IS the whole site.
    # NOTE: nginx's add_header is REPLACING, not additive - any add_header in a
    # location discards every one inherited from the server block. So the
    # security headers must be repeated in each location that sets a header of
    # its own, or the main page would be served with none of them.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;
    }

    # Applies to anything NOT matched by /index.html above (404s, a favicon,
    # any file added later). Fonts come from Google; everything else is inline
    # or same-origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;

    access_log /var/log/nginx/isaacted.access.log;
    error_log  /var/log/nginx/isaacted.error.log;
}
